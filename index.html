<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>todo_project</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-300 ">

    <div class="bg-[#F5F5F5] w-[750px] min-h-[550px] h-auto ml-64 rounded-xl mt-14 pt-10 px-10">

        <h1 class="font-bold text-3xl text-center text-gray-800">
            Todo App
        </h1>

        <div class="mt-5 text-center">

            <p class="text-gray-600 text-base leading-7">
                Learn Redux Toolkit with this simple example. This app is built
                to understand Redux Toolkit syntax and concepts, so todos are
                not permanently saved.
            </p>

        </div>

        <div class="bg-gray-200 w-[670px] h-32 mt-16 rounded-xl p-4">

            <h1 class="font-semibold text-2xl px-2">
                Add New Todo
            </h1>

            <input type="text" placeholder="Enter Todo..."
                class="w-[480px] h-12 mt-3 px-4 py-2 rounded-lg border border-gray-300 outline-none focus:ring-2 focus:ring-blue-400">

            <button class="bg-blue-500 w-36 h-12 text-white text-lg px-6 py-2 rounded-lg hover:bg-blue-600">
                <span class="text-gray-800">+</span> Add Todo
            </button>

        </div>

        <div class="bg-gray-200 w-[670px] min-h-32 mt-8 rounded-xl p-4">

            <h1 class="font-semibold text-2xl px-2 mb-4">
                My Todos (1)
            </h1>

            <div class="flex items-center gap-3">

                <h1 class="bg-white flex-1 min-h-12 px-4 py-3 rounded-lg border border-gray-300 text-gray-700">
                    Learn Redux Toolkit
                </h1>

                <button class="bg-red-500 text-white px-5 py-3 rounded-lg hover:bg-red-600">
                    Delete
                </button>

            </div>

        </div>

    </div>

</body>
<script src="script.js"></script>

</html>
